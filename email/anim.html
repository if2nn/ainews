<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#F1EBDD}svg{display:block}
</style></head><body><div id="root"></div><script>
const P={ink:'#141210',paper:'#F1EBDD',red:'#E8452C',blue:'#2B4BDB',sun:'#F2B82E'};
const q=new URLSearchParams(location.search);const mode=q.get('m');const CAP=(q.get('cap')||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function blob(cx,cy,r,k,t,n=64){ // superformula-ish morph between circle(k=0) square(k=1) star(k=2)
 let d='';for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;
  const sq=1/Math.max(Math.abs(Math.cos(a)),Math.abs(Math.sin(a)));
  const st=1+.28*Math.cos(6*a+t*Math.PI*2);
  let f;if(k<=1)f=1+(sq*.86-1)*k;else f=(sq*.86)*(2-k)+st*(k-1);
  d+=(i?'L':'M')+(cx+Math.cos(a)*r*f).toFixed(1)+' '+(cy+Math.sin(a)*r*f).toFixed(1);}
 return d+'Z';}
function render(T){const R=document.getElementById('root');
if(mode==='cover'){const W=600,H=380;
 // 3 phases loop: circle->square->star->circle
 const ph=T*3, i=Math.floor(ph)%3, f=ease(ph-Math.floor(ph));
 const ks=[0,1,2,0]; const k=ks[i]+(ks[i+1]-ks[i])*f;
 const k2=ks[(i+1)%3]+(ks[(i+1)%3+1]-ks[(i+1)%3])*f;
 const rot=T*90;
 let lines='';for(let y=0;y<H;y+=14)lines+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${P.ink}" stroke-opacity=".07"/>`;
 R.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="${P.ink}"/>
 <g>${lines.replaceAll(P.ink,P.paper)}</g>
 <path d="${blob(210,200,120,k,T)}" fill="${P.red}" transform="rotate(${rot} 210 200)"/>
 <path d="${blob(400,170,78,k2,T+.3)}" fill="${P.blue}" style="mix-blend-mode:screen" transform="rotate(${-rot*2} 400 170)"/>
 <circle cx="${470+Math.cos(T*Math.PI*2)*40}" cy="${290+Math.sin(T*Math.PI*2)*22}" r="26" fill="${P.sun}"/>
 <path d="${blob(470+Math.cos(T*Math.PI*2)*40,290+Math.sin(T*Math.PI*2)*22,26,k,T)}" fill="none" stroke="${P.paper}" stroke-width="2"/>
 <text x="24" y="356" font-family="Noto Sans CJK SC" font-weight="700" font-size="13" letter-spacing="4" fill="${P.paper}" opacity=".8">${CAP}</text>
 <text x="576" y="36" text-anchor="end" font-family="Noto Serif CJK SC" font-weight="900" font-size="14" letter-spacing="3" fill="${P.sun}">STATES / 03</text>
 </svg>`;}
if(mode==='title'){const W=600,H=170;const words=['AI','早','报'];
 // each glyph drops in staggered, holds, then slides out up; loop
 let g='';const xs=[24,214,384];const sizes=[150,150,150];
 words.forEach((w,j)=>{const s=j*.08;let y,o;const a=(T-s+1)%1;
  if(a<.25){const e=ease(a/.25);y=170*(1-e)+0;o=1}else if(a<.75){y=0;o=1}else{const e=ease((a-.75)/.25);y=-170*e}
  g+=`<g clip-path="url(#c)"><text x="${xs[j]}" y="${148+y}" font-family="${j?'Noto Serif CJK SC':'Noto Sans CJK SC'}" font-weight="900" font-size="${sizes[j]}" fill="${j===1?P.red:P.ink}" letter-spacing="-6">${w}</text></g>`;});
 const bar=ease(Math.min(1,(T%1)/.3));
 R.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><clipPath id="c"><rect width="${W}" height="${H}"/></clipPath></defs>
 <rect width="${W}" height="${H}" fill="${P.paper}"/>${g}
 <rect x="0" y="164" width="${W*bar}" height="6" fill="${P.ink}"/></svg>`;}
if(mode.startsWith('icon')){const S=96;let c='';const t=T*Math.PI*2;
 if(mode==='icon1'){ // speed dial 30->50
  const v=Math.round(30+20*ease(T<.5?T*2:2-2*T));const ang=-120+240*(v-30)/30;
  c=`<circle cx="48" cy="54" r="34" fill="none" stroke="${P.ink}" stroke-width="6" stroke-dasharray="142 300" transform="rotate(150 48 54)"/>
  <line x1="48" y1="54" x2="${48+Math.sin(ang*Math.PI/180)*28}" y2="${54-Math.cos(ang*Math.PI/180)*28}" stroke="${P.red}" stroke-width="5" stroke-linecap="round"/>
  <circle cx="48" cy="54" r="6" fill="${P.ink}"/><text x="48" y="88" text-anchor="middle" font-family="Noto Sans CJK SC" font-weight="900" font-size="16" fill="${P.ink}">${v} TPS</text>`;}
 if(mode==='icon2'){ // chip spinning w/ pins
  let pins='';for(let i=0;i<4;i++)for(const s of [-1,1]){pins+=`<rect x="${32+i*10}" y="${s<0?14:74}" width="5" height="8" fill="${P.ink}"/><rect y="${32+i*10}" x="${s<0?14:74}" height="5" width="8" fill="${P.ink}"/>`;}
  c=`<g transform="rotate(${T*90} 48 48)">${pins}<rect x="24" y="24" width="48" height="48" rx="6" fill="${P.blue}"/>
  <rect x="36" y="36" width="24" height="24" fill="${P.sun}" transform="rotate(${-T*180} 48 48)"/></g>`;}
 if(mode==='icon3'){ // document w/ watermark wave
  let w='';for(let r=0;r<5;r++){let d='';for(let x=0;x<=44;x+=2)d+=(x?'L':'M')+(26+x)+' '+(30+r*10+Math.sin(x/6+t+r)*2.5).toFixed(1);w+=`<path d="${d}" stroke="${r%2?P.red:P.ink}" stroke-width="3" fill="none" opacity="${.35+.65*((Math.sin(t-r)+1)/2)}"/>`;}
  c=`<rect x="18" y="14" width="60" height="72" rx="4" fill="#fff" stroke="${P.ink}" stroke-width="4"/>${w}`;}
 if(mode==='icon4'){ // ad frame / image pops
  const s=.6+.4*ease((Math.sin(t)+1)/2);
  c=`<rect x="14" y="20" width="68" height="56" rx="4" fill="none" stroke="${P.ink}" stroke-width="4"/>
  <g transform="translate(48 48) scale(${s}) translate(-48 -48)"><circle cx="38" cy="42" r="8" fill="${P.sun}"/><path d="M20 70 L42 50 L56 62 L66 52 L78 70Z" fill="${P.red}"/></g>
  <rect x="58" y="12" width="28" height="16" rx="3" fill="${P.ink}"/><text x="72" y="24" text-anchor="middle" font-family="Noto Sans CJK SC" font-weight="900" font-size="11" fill="${P.paper}">AD</text>`;}
 R.innerHTML=`<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><rect width="${S}" height="${S}" fill="${P.paper}"/>${c}</svg>`;}
}
window.render=render;render(0);
</script></body></html>
